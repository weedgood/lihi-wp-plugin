services:
  db:
    image: mysql:9
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp_uploads:/var/www/html/wp-content/uploads
      - ./lihi-shorturl:/var/www/html/wp-content/plugins/lihi-shorturl
    # The named volume's mount point is created as root; WordPress's
    # entrypoint doesn't chown into mounted volumes, so fix it before exec.
    entrypoint:
      - bash
      - -c
      - |
        chown www-data:www-data /var/www/html/wp-content/uploads
        exec docker-entrypoint.sh "$$0" "$$@"
    command: apache2-foreground

  db_test:
    image: mysql:9
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wordpress_test
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - test

  phpunit:
    build:
      context: .
      dockerfile: docker/phpunit/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      db_test:
        condition: service_healthy
    command: [ "tail", "-f", "/dev/null" ]
    profiles:
      - test

volumes:
  db_data:
  wp_uploads:
