name: Package Plugin

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  package:
    name: Build plugin zip
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate plugin files
        run: |
          test -f lihi-short-url/lihi-short-url.php
          test -f lihi-short-url/readme.txt

      - name: Create plugin zip
        run: |
          set -euo pipefail
          mkdir -p build
          zip -r build/lihi-short-url.zip lihi-short-url \
            -x 'lihi-short-url/.DS_Store' \
            -x 'lihi-short-url/**/.DS_Store'

          unzip -t build/lihi-short-url.zip
          unzip -Z1 build/lihi-short-url.zip | grep -qx 'lihi-short-url/lihi-short-url.php'
          unzip -Z1 build/lihi-short-url.zip | grep -qx 'lihi-short-url/readme.txt'

      - name: Upload plugin zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: lihi-short-url-plugin
          path: build/lihi-short-url.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download plugin zip artifact
        uses: actions/download-artifact@v4
        with:
          name: lihi-short-url-plugin
          path: build

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" build/lihi-short-url.zip --clobber
          else
            gh release create "$TAG_NAME" build/lihi-short-url.zip \
              --title "$TAG_NAME" \
              --generate-notes
          fi
